<style>

<script>
const DATA = [{"nr": "5.1", "namn": "Sannolikhet", "mal": [{"mal": "Förklara vad utfall, gynnsamma utfall och möjliga utfall är", "q": "Du kastar en vanlig tärning. Hur många möjliga utfall finns det?", "alt": ["6", "1", "3", "12"], "fork": "Tärningen kan visa 1, 2, 3, 4, 5 eller 6. Det är 6 möjliga utfall.", "bild": ""}, {"mal": "Räkna ut sannolikheten i bråkform, decimalform och procentform", "q": "I en burk finns 4 gula och 16 vita lappar. Hur stor är sannolikheten att du drar en gul lapp?", "alt": ["20 %", "4 %", "25 %", "40 %"], "fork": "Det finns 20 lappar. P(gul) = <span class=\"br\"><span>4</span><span>20</span></span> = 0,2 = 20 %. (Jämför inte med bara de vita.)", "bild": ""}, {"mal": "Använda att P(A) + P(inte A) = 1", "q": "Sannolikheten att det regnar i morgon är 0,3. Hur stor är sannolikheten att det inte regnar?", "alt": ["0,7", "0,3", "1,3", "0"], "fork": "P(regn) + P(inte regn) = 1. 1 − 0,3 = 0,7.", "bild": ""}], "tb": "https://drive.google.com/file/d/14GGyLcy_sz9kK-ws7pdemLeLoe8gRR4h/view", "lek": "https://drive.google.com/file/d/1clhZT4hTajo_lDbW6j7tSyjuRBspE_5u/view", "ts": "https://drive.google.com/file/d/1wXw5yygEZI_e5yuibiSy1RSihpWRvtHQ/view"}, {"nr": "5.2", "namn": "Tabeller och diagram", "mal": [{"mal": "Göra en frekvenstabell", "q": "Vad visar frekvensen i en frekvenstabell?", "alt": ["Hur många gånger ett värde förekommer", "Det största värdet", "Medelvärdet", "Antalet kolumner"], "fork": "Frekvens = antal gånger. Om 5 elever har 1 syskon är frekvensen för 1 syskon 5.", "bild": ""}, {"mal": "Rita och läsa av stolp-, stapel- och linjediagram", "q": "Diagrammet visar elevernas favoritfrukt. Hur många fler valde banan än äpple?", "alt": ["3", "9", "6", "15"], "fork": "Banan: 9 elever. Äpple: 6 elever. 9 − 6 = 3.", "bild": "<svg viewBox=\"0 0 320 190\" width=\"100%\" style=\"max-width:320px\" role=\"img\" aria-label=\"Stapeldiagram favoritfrukt: äpple 6, banan 9, päron 3, apelsin 5\"><line x1=\"34\" y1=\"160\" x2=\"310\" y2=\"160\" stroke=\"#DDE5D8\"/><text x=\"28\" y=\"164\" font-size=\"11\" text-anchor=\"end\" fill=\"#5F6368\">0</text><line x1=\"34\" y1=\"132\" x2=\"310\" y2=\"132\" stroke=\"#DDE5D8\"/><text x=\"28\" y=\"136\" font-size=\"11\" text-anchor=\"end\" fill=\"#5F6368\">2</text><line x1=\"34\" y1=\"104\" x2=\"310\" y2=\"104\" stroke=\"#DDE5D8\"/><text x=\"28\" y=\"108\" font-size=\"11\" text-anchor=\"end\" fill=\"#5F6368\">4</text><line x1=\"34\" y1=\"76\" x2=\"310\" y2=\"76\" stroke=\"#DDE5D8\"/><text x=\"28\" y=\"80\" font-size=\"11\" text-anchor=\"end\" fill=\"#5F6368\">6</text><line x1=\"34\" y1=\"48\" x2=\"310\" y2=\"48\" stroke=\"#DDE5D8\"/><text x=\"28\" y=\"52\" font-size=\"11\" text-anchor=\"end\" fill=\"#5F6368\">8</text><line x1=\"34\" y1=\"20\" x2=\"310\" y2=\"20\" stroke=\"#DDE5D8\"/><text x=\"28\" y=\"24\" font-size=\"11\" text-anchor=\"end\" fill=\"#5F6368\">10</text><rect x=\"50\" y=\"76\" width=\"40\" height=\"84\" fill=\"#58A73E\" rx=\"3\"/><text x=\"70\" y=\"176\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#292A28\">Äpple</text><rect x=\"116\" y=\"34\" width=\"40\" height=\"126\" fill=\"#58A73E\" rx=\"3\"/><text x=\"136\" y=\"176\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#292A28\">Banan</text><rect x=\"182\" y=\"118\" width=\"40\" height=\"42\" fill=\"#58A73E\" rx=\"3\"/><text x=\"202\" y=\"176\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#292A28\">Päron</text><rect x=\"248\" y=\"90\" width=\"40\" height=\"70\" fill=\"#58A73E\" rx=\"3\"/><text x=\"268\" y=\"176\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#292A28\">Apelsin</text><line x1=\"34\" y1=\"160\" x2=\"310\" y2=\"160\" stroke=\"#292A28\"/><text x=\"4\" y=\"12\" font-size=\"11\" fill=\"#5F6368\">Antal elever</text></svg>"}, {"mal": "Välja ett lämpligt diagram och motivera valet", "q": "Vilket diagram passar bäst för att visa hur många elever som valde olika sporter?", "alt": ["stapeldiagram", "linjediagram", "cirkel utan sektorer", "en tom tabell"], "fork": "Sporterna är olika kategorier, då passar stapeldiagram. Linjediagram passar när något förändras över tid.", "bild": ""}], "tb": "https://drive.google.com/file/d/19W-Q8jaT__Me3noGyuUuMlo1sZ6K8Gsb/view", "lek": "https://drive.google.com/file/d/11b8Ki7WmM6COYEe_eKVoGym0GSMhoW9S/view", "ts": "https://drive.google.com/file/d/1zVJZHivdjbf4eK7y9dNCnj3_2d3atL1Q/view"}, {"nr": "5.3", "namn": "Relativ frekvens", "mal": [{"mal": "Förklara vad relativ frekvens är och varför den är bra", "q": "Varför är relativ frekvens bra?", "alt": ["Man kan jämföra grupper som har olika storlek", "Den är alltid större än frekvensen", "Man behöver inte räkna", "Den visar medelvärdet"], "fork": "Relativ frekvens är en andel, så man kan jämföra till exempel en klass med 20 elever och en med 25.", "bild": ""}, {"mal": "Räkna ut relativ frekvens i bråk-, decimal- och procentform", "q": "8 av 40 elever har glasögon. Vad är den relativa frekvensen?", "alt": ["0,2", "0,8", "0,32", "5"], "fork": "<span class=\"br\"><span>8</span><span>40</span></span> = <span class=\"br\"><span>1</span><span>5</span></span> = 0,2 = 20 %.", "bild": ""}, {"mal": "Rita ett diagram med relativ frekvens", "q": "Du ritar ett stapeldiagram med relativ frekvens i procent. Vad blir summan av alla staplar?", "alt": ["100 %", "antalet personer", "50 %", "olika varje gång"], "fork": "Alla andelar tillsammans är det hela, alltså 100 % (eller 1).", "bild": ""}], "tb": "https://drive.google.com/file/d/1tnUj1Ndm2omAw7FItFF-IvavI5QSwsgi/view", "lek": "https://drive.google.com/file/d/1v6QYaWgQVLfYqE1SVIxh9duhD5gK_V1R/view", "ts": "https://drive.google.com/file/d/1YjxbsXKtZGsVKiP72C0cPKXGnjIayFuO/view"}, {"nr": "5.4", "namn": "Lägesmått", "mal": [{"mal": "Bestämma typvärdet och räkna ut medelvärdet", "q": "Vad är medelvärdet av 4, 6, 7, 9, 9?", "alt": ["7", "9", "6", "35"], "fork": "Summan är 35. <span class=\"br\"><span>35</span><span>5</span></span> = 7. (9 är typvärdet.)", "bild": ""}, {"mal": "Bestämma medianen vid udda och jämnt antal värden", "q": "Vad är medianen av 3, 6, 8, 10?", "alt": ["7", "6", "8", "6,75"], "fork": "Jämnt antal värden: medianen är medelvärdet av de två mittersta. <span class=\"br\"><span>6 + 8</span><span>2</span></span> = 7.", "bild": ""}, {"mal": "Välja det lägesmått som ger bäst bild och motivera", "q": "Lönerna på ett litet företag är 25 000, 26 000, 27 000, 28 000 och 150 000 kr. Vilket lägesmått ger bäst bild av en vanlig lön?", "alt": ["medianen", "medelvärdet", "det största värdet", "summan"], "fork": "Medianen (27 000 kr) påverkas inte av den höga lönen. Medelvärdet blir 51 200 kr, vilket nästan ingen tjänar.", "bild": ""}], "tb": "https://drive.google.com/file/d/16PKM_Te_wo_XSiMLklM5uUcOT2lrWCHW/view", "lek": "https://drive.google.com/file/d/1UCZQgbQ8Bu7UdYKzDgrn_PHxZ5x7UmMv/view", "ts": "https://drive.google.com/file/d/19D906RXYWHZStwgxyDUFG5-Ls9Gl9B0N/view"}, {"nr": "5.5", "namn": "Lägesmått från tabeller och diagram", "mal": [{"mal": "Läsa av typvärdet i en tabell eller ett diagram", "q": "Tabellen visar hur många böcker 20 elever har läst. Vad är typvärdet?", "alt": ["2", "8", "4", "20"], "fork": "Typvärdet är värdet med högst frekvens. Frekvensen 8 hör till 2 böcker.", "bild": "<table class=\"mt\"><tr><th>Antal böcker (x)</th><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>Frekvens (f)</th><td>5</td><td>8</td><td>4</td><td>3</td></tr></table>"}, {"mal": "Räkna ut medelvärdet med kolumnen f · x", "q": "Använd tabellen ovan. Summan av f · x är 5 + 16 + 12 + 12 = 45. Vad är medelvärdet?", "alt": ["2,25", "11,25", "2,5", "45"], "fork": "Dela med antalet elever: <span class=\"br\"><span>45</span><span>20</span></span> = 2,25.", "bild": ""}, {"mal": "Hitta medianen med hjälp av frekvenserna", "q": "Använd tabellen ovan. Vad är medianen?", "alt": ["2", "2,5", "3", "8"], "fork": "20 värden: medianen ligger mellan värde nr 10 och 11. De första 5 är 1, värde 6–13 är 2. Båda är 2, så medianen är 2.", "bild": ""}], "tb": "https://drive.google.com/file/d/1L18OfiIJ2QsVAzi6dazWWRPWam7zesxC/view", "lek": "https://drive.google.com/file/d/1TosOBy4ZySKJXFI2tziQGvcbxwJjFIWk/view", "ts": "https://drive.google.com/file/d/1pLD-KCREdC4QoVoi_zapUdFhmX7R3WOM/view"}, {"nr": "5.6", "namn": "Cirkeldiagram", "mal": [{"mal": "Läsa av andelar i ett cirkeldiagram", "q": "I ett cirkeldiagram är halva cirkeln 'Buss'. Hur många procent åker buss?", "alt": ["50 %", "180 %", "25 %", "100 %"], "fork": "Halva cirkeln är hälften av det hela, alltså 50 %. (Vinkeln är 180°.)", "bild": ""}, {"mal": "Räkna ut medelpunktsvinkeln och andelen", "q": "En sektor är 20 % av cirkeln. Hur stor är medelpunktsvinkeln?", "alt": ["72°", "20°", "36°", "90°"], "fork": "0,2 · 360° = 72°.", "bild": ""}, {"mal": "Rita ett cirkeldiagram med passare och gradskiva", "q": "Vilka verktyg behöver du för att rita ett cirkeldiagram för hand?", "alt": ["passare och gradskiva", "bara linjal", "miniräknare", "gradskiva och tärning"], "fork": "Passaren ritar cirkeln och gradskivan mäter upp medelpunktsvinklarna.", "bild": ""}], "tb": "https://drive.google.com/file/d/1iPEwEcGGiQEQ2v0EaISAOoXfp51e9t-Y/view", "lek": "https://drive.google.com/file/d/1vQeSres8nSnuHsChNU8U6vQxawPo7I_l/view", "ts": "https://drive.google.com/file/d/12cW41HT9qfQxvyb23EABtz9aEAt8eDB7/view"}];
const SK = ["Osäker", "Ganska säker", "Säker"];
const skatt = {}, svar = {}, ordning = {};
const id = (a, m) => a + "-" + m;
const tot = DATA.reduce((s, a) => s + a.mal.length, 0);
function blanda(n) { const r = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }

function del1() {
  document.getElementById("del1").innerHTML = DATA.map(a => `<div class="kort"><h2><b>${a.nr}</b>${a.namn}</h2>` +
    a.mal.map((m, i) => `<div class="mrad"><div class="t">Jag kan ${m.mal.charAt(0).toLowerCase() + m.mal.slice(1)}.</div>
      <div class="knappar" data-k="${id(a.nr, i)}">${[2, 1, 0].map(v => `<button data-v="${v}">${SK[v]}</button>`).join("")}</div></div>`).join("") + `</div>`).join("");
  document.querySelectorAll(".knappar").forEach(k => k.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    k.querySelectorAll("button").forEach(x => x.classList.remove("val")); b.classList.add("val");
    skatt[k.dataset.k] = +b.dataset.v; kollaDel1();
  }));
  kollaDel1();
}
function kollaDel1() {
  const n = Object.keys(skatt).length;
  document.getElementById("till2").disabled = n < tot;
  document.getElementById("kvar").textContent = n < tot ? `Du har skattat ${n} av ${tot} mål.` : "Bra! Nu kan du gå vidare.";
}
function del2() {
  document.getElementById("del2").innerHTML = DATA.map(a => `<div class="kort"><h2><b>${a.nr}</b>${a.namn}</h2>` +
    a.mal.map((m, i) => { const k = id(a.nr, i); ordning[k] = blanda(m.alt.length);
      return `<div class="fraga" id="f-${k}"><div class="q">${m.q}<i>Mål: ${m.mal}</i></div>${m.bild ? `<div class="bild">${m.bild}</div>` : ""}
      <div class="alt">${ordning[k].map(j => `<label data-j="${j}"><input type="radio" name="${k}" value="${j}"><span>${m.alt[j]}</span></label>`).join("")}</div>
      <div class="fork">${m.fork}</div></div>`; }).join("") + `</div>`).join("");
  document.querySelectorAll("#del2 input").forEach(inp => inp.addEventListener("change", () => { svar[inp.name] = +inp.value; }));
}
function kommentar(s, r) {
  if (r && s === 2) return "Du kan det, och du visste det. Bra koll!";
  if (r) return "Rätt! Du kan mer än du trodde.";
  if (s === 2) return "Här trodde du att du kunde. Läs förklaringen och titta på lektionen igen.";
  if (s === 1) return "Du var lite osäker, och det här behöver du öva mer på.";
  return "Du kände rätt: det här behöver du öva mer på.";
}
const UTMANA = "../utmana-dig/kapitel-5.pdf";
const lnk = (u, t) => u ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : `<b>${t}</b>`;
function rek(a, ratt) {
  if (ratt === a.mal.length) return `<b>Tips:</b> Du klarade allt i ${a.nr}. Prova ${lnk(UTMANA, "Utmana dig")} för kapitel ${String(a.nr).split(".")[0]}.`;
  if (ratt === a.mal.length - 1) return `<b>Tips:</b> Läs förklaringen till frågan du missade och gör ${lnk(a.tb, "Tillbakablick " + a.nr)}.`;
  return `<b>Tips:</b> Titta på ${lnk(a.lek, "lektionen " + a.nr + " " + a.namn)} igen och träna med ${lnk(a.ts, "Trygg start " + a.nr)}.`;
}
function ratta() {
  const obes = DATA.flatMap(a => a.mal.map((m, i) => id(a.nr, i))).filter(k => !(k in svar));
  if (obes.length && !confirmFri(obes.length)) return;
  let rattTot = 0, stamde = 0, merAn = 0, trodde = 0;
  let html = "";
  DATA.forEach(a => {
    let ratt = 0, rader = "";
    a.mal.forEach((m, i) => {
      const k = id(a.nr, i), r = svar[k] === 0, s = skatt[k];
      if (r) { ratt++; rattTot++; }
      if ((r && s === 2) || (!r && s === 0)) stamde++;
      if (r && s < 2) merAn++;
      if (!r && s === 2) trodde++;
      rader += `<tr><td>${m.mal}</td><td><span class="etk e${s}">${SK[s]}</span></td><td>${r ? "✔ Rätt" : "✘ Fel"}</td><td>${kommentar(s, r)}</td></tr>`;
      const f = document.getElementById("f-" + k); f.classList.add("visa");
      f.querySelectorAll("label").forEach(l => { const j = +l.dataset.j; if (j === 0) l.classList.add("ratt"); else if (svar[k] === j) l.classList.add("fel"); });
      f.querySelectorAll("input").forEach(x => x.disabled = true);
    });
    html += `<div class="kort"><h2><b>${a.nr}</b>${a.namn} · ${ratt} av ${a.mal.length} rätt</h2>
      <table><tr><th>Mål</th><th>Din känsla</th><th>Svar</th><th>Kommentar</th></tr>${rader}</table><div class="rek">${rek(a, ratt)}</div></div>`;
  });
  document.getElementById("del3").innerHTML = `<div class="summa">
    <div><b>${rattTot} / ${tot}</b>rätt svar</div><div><b>${stamde}</b>gånger stämde din känsla</div>
    <div><b>${merAn}</b>gånger kunde du mer än du trodde</div><div><b>${trodde}</b>gånger trodde du att du kunde</div></div>
    <p class="info" style="margin-top:0">Rätt och fel syns också vid frågorna längre ned, med en förklaring.</p>` + html;
  visa(3);
}
function confirmFri(n) {
  const el = document.getElementById("kvarFr");
  if (el) { el.remove(); return true; }
  const p = document.createElement("p"); p.id = "kvarFr"; p.className = "info";
  p.textContent = `Du har ${n} fråga(or) kvar. Tryck på Rätta en gång till om du vill rätta ändå.`;
  document.getElementById("ratta").after(p); return false;
}
function visa(n) {
  ["s1", "s2", "s3"].forEach((s, i) => document.getElementById(s).classList.toggle("akt", i === n - 1));
  document.getElementById("del1").classList.toggle("dold", n !== 1);
  document.getElementById("till2").classList.toggle("dold", n !== 1);
  document.getElementById("kvar").classList.toggle("dold", n !== 1);
  document.getElementById("del2").classList.toggle("dold", n === 1);
  document.getElementById("ratta").classList.toggle("dold", n !== 2);
  document.getElementById("del3").classList.toggle("dold", n !== 3);
  document.getElementById("om").classList.toggle("dold", n !== 3);
  const fr = document.getElementById("kvarFr"); if (fr && n !== 2) fr.remove();
  if (n === 3) document.getElementById("del2").before(document.getElementById("del3"));
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.getElementById("till2").onclick = () => { del2(); visa(2); };
document.getElementById("ratta").onclick = ratta;
document.getElementById("om").onclick = () => { location.reload(); };
del1();
</script></body></html>
