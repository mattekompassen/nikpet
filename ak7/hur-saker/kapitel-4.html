 det hela"], "fork": "Andel = <span class=\"br\"><span>delen</span><span>det hela</span></span>.", "bild": ""}, {"mal": "Skriva en andel i bråkform", "q": "20 av 32 elever åker buss. Hur stor andel åker buss?", "alt": ["<span class=\"br\"><span>20</span><span>32</span></span>", "<span class=\"br\"><span>32</span><span>20</span></span>", "<span class=\"br\"><span>12</span><span>32</span></span>", "<span class=\"br\"><span>20</span><span>52</span></span>"], "fork": "Delen är 20 och det hela är 32: <span class=\"br\"><span>20</span><span>32</span></span> (= <span class=\"br\"><span>5</span><span>8</span></span>).", "bild": ""}, {"mal": "Förkorta ett bråk till enklaste form", "q": "Förkorta <span class=\"br\"><span>16</span><span>20</span></span> till enklaste form.", "alt": ["<span class=\"br\"><span>4</span><span>5</span></span>", "<span class=\"br\"><span>8</span><span>10</span></span>", "<span class=\"br\"><span>2</span><span>3</span></span>", "<span class=\"br\"><span>16</span><span>20</span></span>"], "fork": "Dela täljare och nämnare med 4: <span class=\"br\"><span>16</span><span>20</span></span> = <span class=\"br\"><span>4</span><span>5</span></span>. <span class=\"br\"><span>8</span><span>10</span></span> går att förkorta mer.", "bild": ""}], "tb": "https://drive.google.com/file/d/1WaMoK6Rcy4Vt_2IXgYC81zR-Ai_3aDaF/view", "lek": "https://drive.google.com/file/d/1tI-GrD70QpSMr0ZIO7gbpVbmjAhMunTN/view", "ts": "https://drive.google.com/file/d/1Ye1pZM_1ErvkDCWKY2T4XYy6J41HcDdA/view"}, {"nr": "4.5", "namn": "Andel i procentform (I)", "mal": [{"mal": "Förklara vad procent betyder", "q": "Vad betyder procent?", "alt": ["hundradel", "tiondel", "tusendel", "en hel"], "fork": "1 % = <span class=\"br\"><span>1</span><span>100</span></span> = 0,01.", "bild": ""}, {"mal": "Skriva en andel i bråkform, decimalform och procentform", "q": "Vilket tal är lika mycket som 40 %?", "alt": ["0,4", "0,04", "4,0", "40,0"], "fork": "40 % = <span class=\"br\"><span>40</span><span>100</span></span> = 0,40 = 0,4.", "bild": ""}, {"mal": "Räkna ut hur många procent en del är av det hela", "q": "7 av 50 elever är vänsterhänta. Hur många procent är det?", "alt": ["14 %", "7 %", "43 %", "35 %"], "fork": "<span class=\"br\"><span>7</span><span>50</span></span> = <span class=\"br\"><span>14</span><span>100</span></span> = 14 %.", "bild": ""}], "tb": "https://drive.google.com/file/d/1R2JN1OlFgtjHJdmjOTx6eV_Wi7uZLse3/view", "lek": "https://drive.google.com/file/d/1IwCF0bplXGNhTXCzpqfgWRcpUz1ixffO/view", "ts": "https://drive.google.com/file/d/1chxtZBROLZmyHNf4Z_pEEcM16syekRaq/view"}, {"nr": "4.6", "namn": "Andel i procentform (II)", "mal": [{"mal": "Räkna ut en andel i procent genom att dividera delen med det hela", "q": "Hur räknar man ut andelen i procent?", "alt": ["<span class=\"br\"><span>delen</span><span>det hela</span></span>", "<span class=\"br\"><span>det hela</span><span>delen</span></span>", "delen − det hela", "delen · det hela"], "fork": "Dividera delen med det hela och skriv kvoten i procent.", "bild": ""}, {"mal": "Avrunda till hela procent och tiondels procent", "q": "13 av 70 elever valde tennis. Hur många procent är det, avrundat till hela procent?", "alt": ["19 %", "18 %", "13 %", "20 %"], "fork": "<span class=\"br\"><span>13</span><span>70</span></span> ≈ 0,186 ≈ 19 %. Siffran efter 18 är 6, så vi avrundar uppåt.", "bild": ""}, {"mal": "Räkna ut med hur många procent något ökar eller sänks", "q": "Ett pris höjs från 400 kr till 460 kr. Med hur många procent höjs priset?", "alt": ["15 %", "60 %", "13 %", "6 %"], "fork": "Ökningen är 60 kr. Jämför med det ursprungliga priset: <span class=\"br\"><span>60</span><span>400</span></span> = 0,15 = 15 %.", "bild": ""}], "tb": "https://drive.google.com/file/d/1sZSgwor4HBmEn1mg02xSh9OqExcKdVEg/view", "lek": "https://drive.google.com/file/d/1etPG0djB63aFOEVpzPRVZbHb1fdoS4Y5/view", "ts": "https://drive.google.com/file/d/1Hc2stf14JdYTTFpc-QPcBiPWD5gOdLW6/view"}, {"nr": "4.7", "namn": "Hur stor är delen?", "mal": [{"mal": "Räkna ut delen när andelen är ett bråk, ett decimaltal eller i procent", "q": "Vad är <span class=\"br\"><span>3</span><span>4</span></span> av 60?", "alt": ["45", "15", "20", "80"], "fork": "<span class=\"br\"><span>1</span><span>4</span></span> av 60 = 15. <span class=\"br\"><span>3</span><span>4</span></span> = 3 · 15 = 45.", "bild": ""}, {"mal": "Välja ett smart sätt att räkna, till exempel via 10 % eller 1 %", "q": "Vilket är ett smart sätt att räkna ut 5 % av 480?", "alt": ["Räkna ut 10 % = 48 och ta hälften, 24", "Räkna 480 / 5", "Räkna 480 · 5", "Räkna 480 − 5"], "fork": "5 % är hälften av 10 %. 10 % av 480 = 48, hälften är 24.", "bild": ""}], "tb": "https://drive.google.com/file/d/1pjs1B_fvROwYeDo3dFFUTefQyqGgEGrd/view", "lek": "https://drive.google.com/file/d/1nyVplHd3qxEfSS5ElALVpQJkgO-EkUGa/view", "ts": "https://drive.google.com/file/d/1vVG5uQQ6ZGdis6TnEKLK0oRxn8kJe1oG/view"}];

function del1() {

      f.querySelectorAll("input").forEach(x => x.disabled = true);
    });
    html += `<div class="kort"><h2><b>${a.nr}</b>${a.namn} · ${ratt} av ${a.mal.length} rätt</h2>
      <table><tr><th>Mål</th><th>Din känsla</th><th>Svar</th><th>Kommentar</th></tr>${rader}</table><div class="rek">${rek(a, ratt)}</div></div>`;
  });
  document.getElementById("del3").innerHTML = `<div class="summa">
    <div><b>${rattTot} / ${tot}</b>rätt svar</div><div><b>${stamde}</b>gånger stämde din känsla</div>
    <div><b>${merAn}</b>gånger kunde du mer än du trodde</div><div><b>${trodde}</b>gånger trodde du att du kunde</div></div>
    <p class="info" style="margin-top:0">Rätt och fel syns också vid frågorna längre ned, med en förklaring.</p>` + html;
  visa(3);
}
function confirmFri(n) {
  const el = document.getElementById("kvarFr");
  if (el) { el.remove(); return true; }
  const p = document.createElement("p"); p.id = "kvarFr"; p.className = "info";
  p.textContent = `Du har ${n} fråga(or) kvar. Tryck på Rätta en gång till om du vill rätta ändå.`;
  document.getElementById("ratta").after(p); return false;
}
function visa(n) {
  ["s1", "s2", "s3"].forEach((s, i) => document.getElementById(s).classList.toggle("akt", i === n - 1));
  document.getElementById("del1").classList.toggle("dold", n !== 1);
  document.getElementById("till2").classList.toggle("dold", n !== 1);
  document.getElementById("kvar").classList.toggle("dold", n !== 1);
  document.getElementById("del2").classList.toggle("dold", n === 1);
  document.getElementById("ratta").classList.toggle("dold", n !== 2);
  document.getElementById("del3").classList.toggle("dold", n !== 3);
  document.getElementById("om").classList.toggle("dold", n !== 3);
  const fr = document.getElementById("kvarFr"); if (fr && n !== 2) fr.remove();
  if (n === 3) document.getElementById("del2").before(document.getElementById("del3"));
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.getElementById("till2").onclick = () => { del2(); visa(2); };
document.getElementById("ratta").onclick = ratta;
document.getElementById("om").onclick = () => { location.reload(); };
del1();
