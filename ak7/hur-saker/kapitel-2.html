<p>Först skattar du hur säker du är på varje mål. Sedan svarar du på en fråga per mål. Till sist ser du om din känsla stämde och vad du ska träna mer på. Inget sparas.</p></header>

function del1() {
  document.getElementById("del1").innerHTML = DATA.map(a => `<div class="kort"><h2><b>${a.nr}</b>${a.namn}</h2>` +
    a.mal.map((m, i) => `<div class="mrad"><div class="t">Jag kan ${m.mal.charAt(0).toLowerCase() + m.mal.slice(1)}.</div>

  if (r && s === 2) return "Du kan det, och du visste det. Bra koll!";
  if (r) return "Rätt! Du kan mer än du trodde.";
  if (s === 2) return "Här trodde du att du kunde. Läs förklaringen och titta på lektionen igen.";
  if (s === 1) return "Du var lite osäker, och det här behöver du öva mer på.";
  return "Du kände rätt: det här behöver du öva mer på.";
}
const UTMANA = "../utmana-dig/kapitel-2.pdf";
const lnk = (u, t) => u ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : `<b>${t}</b>`;
function rek(a, ratt) {
  if (ratt === a.mal.length) return `<b>Tips:</b> Du klarade allt i ${a.nr}. Prova ${lnk(UTMANA, "Utmana dig")} för kapitel ${String(a.nr).split(".")[0]}.`;
  if (ratt === a.mal.length - 1) return `<b>Tips:</b> Läs förklaringen till frågan du missade och gör ${lnk(a.tb, "Tillbakablick " + a.nr)}.`;
  return `<b>Tips:</b> Titta på ${lnk(a.lek, "lektionen " + a.nr + " " + a.namn)} igen och träna med ${lnk(a.ts, "Trygg start " + a.nr)}.`;
}
function ratta() {
  const obes = DATA.flatMap(a => a.mal.map((m, i) => id(a.nr, i))).filter(k => !(k in svar));
  if (obes.length && !confirmFri(obes.length)) return;
  let rattTot = 0, stamde = 0, merAn = 0, trodde = 0;
  let html = "";
  DATA.forEach(a => {
    let ratt = 0, rader = "";
    a.mal.forEach((m, i) => {
      const k = id(a.nr, i), r = svar[k] === 0, s = skatt[k];
      if (r) { ratt++; rattTot++; }
      if ((r && s === 2) || (!r && s === 0)) stamde++;
      if (r && s < 2) merAn++;
      if (!r && s === 2) trodde++;
      rader += `<tr><td>${m.mal}</td><td><span class="etk e${s}">${SK[s]}</span></td><td>${r ? "✔ Rätt" : "✘ Fel"}</td><td>${kommentar(s, r)}</td></tr>`;
      const f = document.getElementById("f-" + k); f.classList.add("visa");
      f.querySelectorAll("label").forEach(l => { const j = +l.dataset.j; if (j === 0) l.classList.add("ratt"); else if (svar[k] === j) l.classList.add("fel"); });
      f.querySelectorAll("input").forEach(x => x.disabled = true);
    });
    html += `<div class="kort"><h2><b>${a.nr}</b>${a.namn} · ${ratt} av ${a.mal.length} rätt</h2>
      <table><tr><th>Mål</th><th>Din känsla</th><th>Svar</th><th>Kommentar</th></tr>${rader}</table><div class="rek">${rek(a, ratt)}</div></div>`;
  });
  document.getElementById("del3").innerHTML = `<div class="summa">
    <div><b>${rattTot} / ${tot}</b>rätt svar</div><div><b>${stamde}</b>gånger stämde din känsla</div>
    <div><b>${merAn}</b>gånger kunde du mer än du trodde</div><div><b>${trodde}</b>gånger trodde du att du kunde</div></div>
    <p class="info" style="margin-top:0">Rätt och fel syns också vid frågorna längre ned, med en förklaring.</p>` + html;
  visa(3);
}
function confirmFri(n) {
  const el = document.getElementById("kvarFr");
  if (el) { el.remove(); return true; }
  const p = document.createElement("p"); p.id = "kvarFr"; p.className = "info";
  p.textContent = `Du har ${n} fråga(or) kvar. Tryck på Rätta en gång till om du vill rätta ändå.`;
  document.getElementById("ratta").after(p); return false;
}
function visa(n) {
  ["s1", "s2", "s3"].forEach((s, i) => document.getElementById(s).classList.toggle("akt", i === n - 1));
  document.getElementById("del1").classList.toggle("dold", n !== 1);
  document.getElementById("till2").classList.toggle("dold", n !== 1);
  document.getElementById("kvar").classList.toggle("dold", n !== 1);
  document.getElementById("del2").classList.toggle("dold", n === 1);
  document.getElementById("ratta").classList.toggle("dold", n !== 2);
  document.getElementById("del3").classList.toggle("dold", n !== 3);
  document.getElementById("om").classList.toggle("dold", n !== 3);
  const fr = document.getElementById("kvarFr"); if (fr && n !== 2) fr.remove();
  if (n === 3) document.getElementById("del2").before(document.getElementById("del3"));
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.getElementById("till2").onclick = () => { del2(); visa(2); };
document.getElementById("ratta").onclick = ratta;
document.getElementById("om").onclick = () => { location.reload(); };
del1();
