<header><small>Åk 7 · Kapitel 1 Taluppfattning och tals användning</small><h1>Hur säker är jag?</h1>
<p>Först skattar du hur säker du är på varje mål. Sedan svarar du på en fråga per mål. Till sist ser du om din känsla stämde och vad du ska träna mer på. Inget sparas.</p></header>
<div class="steg"><span id="s1" class="akt">1 Skatta dig själv</span><span id="s2">2 Kontrollfrågor</span><span id="s3">3 Resultat</span></div>

<button class="huvudknapp dold" id="ratta">Rätta</button>

<footer>Mattekompassen</footer>

n> = <span class=\"br\"><span>5</span><span>7</span></span>.", "bild": ""}, {"mal": "Visa bråkberäkningar med bilder", "q": "En pizza är delad i 8 lika stora bitar. Ida äter 3 bitar och Teo äter 2. Hur stor del av pizzan är kvar?", "alt": ["<span class=\"br\"><span>3</span><span>8</span></span>", "<span class=\"br\"><span>5</span><span>8</span></span>", "<span class=\"br\"><span>1</span><span>8</span></span>", "<span class=\"br\"><span>3</span><span>5</span></span>"], "fork": "De äter 5 av 8 bitar. Kvar är 3 bitar, alltså <span class=\"br\"><span>3</span><span>8</span></span> av pizzan. Rita gärna en cirkel med 8 delar.", "bild": ""}], "tb": "https://drive.google.com/file/d/1q8MlAZuxEMfzHVD-iA0s0cfKD-eCMe1w/view", "lek": "https://drive.google.com/file/d/1mSCTxAxVp8XUU50yEJYxMuBa58eAf6b_/view", "ts": "https://drive.google.com/file/d/1MFXmwcHupgKtWP6F97tmdo5BCU9AjKrW/view"}, {"nr": "1.6", "namn": "Multiplikation och division", "mal": [{"mal": "Multiplicera och dividera med 10, 100 och 1 000 och förklara vad som händer med platsvärdet", "q": "Beräkna 4,6 · 100", "alt": ["460", "46", "4 600", "0,046"], "fork": "Gånger 100: siffrorna flyttar två steg åt vänster. 4,6 · 100 = 460.", "bild": ""}, {"mal": "Räkna smart med stora och små tal genom att göra om faktorerna", "q": "Vilket är ett smart sätt att räkna 4 · 27 · 25?", "alt": ["4 · 25 · 27 = 100 · 27", "Räkna 4 · 27 först och sedan gånger 25", "Räkna 27 + 25 först", "4 + 27 + 25"], "fork": "Byt ordning på faktorerna: 4 · 25 = 100, och 100 · 27 = 2 700.", "bild": ""}, {"mal": "Avgöra om en produkt blir större eller mindre än en faktor", "q": "Vilken produkt blir mindre än 80?", "alt": ["80 · 0,7", "80 · 1,2", "80 · 3", "80 · 1"], "fork": "Om man multiplicerar med ett tal mindre än 1 blir produkten mindre: 80 · 0,7 = 56.", "bild": ""}], "tb": "https://drive.google.com/file/d/1UARpxIOZA6pX7B3jiKQANEkbr_S-tZMZ/view", "lek": "https://drive.google.com/file/d/1Zbej8FnuZ50zlgtay_02FPwhqOEe2atQ/view", "ts": "https://drive.google.com/file/d/19BcYfzvTKZQeO0zeyGibfLt5QsXRne2F/view"}, {"nr": "1.7", "namn": "Division med stora och små tal", "mal": [{"mal": "Förenkla divisioner genom att förkorta", "q": "Beräkna <span class=\"br\"><span>2 400</span><span>80</span></span>", "alt": ["30", "300", "3", "32"], "fork": "Förkorta med 10: <span class=\"br\"><span>240</span><span>8</span></span> = 30.", "bild": ""}, {"mal": "Dividera med decimaltal genom att förlänga", "q": "Beräkna <span class=\"br\"><span>9</span><span>0,3</span></span>", "alt": ["30", "3", "0,3", "27"], "fork": "Förläng med 10: <span class=\"br\"><span>90</span><span>3</span></span> = 30.", "bild": ""}, {"mal": "Förklara varför kvoten inte ändras", "q": "Varför är <span class=\"br\"><span>12</span><span>0,4</span></span> lika mycket som <span class=\"br\"><span>120</span><span>4</span></span>?", "alt": ["Täljare och nämnare är multiplicerade med samma tal, och då ändras inte kvoten", "Man får alltid lägga till en nolla", "Man stryker decimaltecknet bara i nämnaren", "Det är en slump"], "fork": "Båda talen är multiplicerade med 10. Då ändras inte kvoten: båda blir 30.", "bild": ""}], "tb": "https://drive.google.com/file/d/1jbzpegeS4z4E4g4mQ-YivuRPX1exEMY9/view", "lek": "https://drive.google.com/file/d/1cGrzPJULXQassihEZqw-2mOSB8YU9BKA/view", "ts": "https://drive.google.com/file/d/19FSb4SiHAGA2d_ViPH2TUNwNK4CzjXP0/view"}, {"nr": "1.8", "namn": "Avrundning och överslagsräkning", "mal": [{"mal": "Avrunda till heltal, tiondelar, hundradelar, tiotal och hundratal", "q": "Avrunda 6,048 till tiondelar.", "alt": ["6,0", "6,1", "6,05", "6,04"], "fork": "Tiondelssiffran är 0. Nästa siffra är 4, så vi avrundar nedåt: 6,0.", "bild": ""}, {"mal": "Göra överslag för att uppskatta ett svar", "q": "Vilket överslag passar bäst för 21,8 · 4,9?", "alt": ["20 · 5 = 100", "21 · 4 = 84", "30 · 5 = 150", "22 · 4 = 88"], "fork": "Avrunda till tal som är lätta att räkna med: 21,8 ≈ 20 och 4,9 ≈ 5. 20 · 5 = 100.", "bild": ""}, {"mal": "Använda överslag för att const SK = ["Osäker", "Ganska säker", "Säker"];
const skatt = {}, svar = {}, ordning = {};
const id = (a, m) => a + "-" + m;
const tot = DATA.reduce((s, a) => s + a.mal.length, 0);
function blanda(n) { const r = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }

function del1() {
  document.getElementById("del1").innerHTML = DATA.map(a => `<div class="kort"><h2><b>${a.nr}</b>${a.namn}</h2>` +
    a.mal.map((m, i) => `<div class="mrad"><div class="t">Jag kan ${m.mal.charAt(0).toLowerCase() + m.mal.slice(1)}.</div>
      <div class="knappar" data-k="${id(a.nr, i)}">${[2, 1, 0].map(v => `<button data-v="${v}">${SK[v]}</button>`).join("")}</div></div>`).join("") + `</div>`).join("");
  document.querySelectorAll(".knappar").forEach(k => k.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    k.querySelectorAll("button").forEach(x => x.classList.remove("val")); b.classList.add("val");
    skatt[k.dataset.k] = +b.dataset.v; kollaDel1();
  }));
  kollaDel1();
}
function kollaDel1() {
  const n = Object.keys(skatt).length;
  document.getElementById("till2").disabled = n < tot;
  document.getElementById("kvar").textContent = n < tot ? `Du har skattat ${n} av ${tot} mål.` : "Bra! Nu kan du gå vidare.";
}
function del2() {
  document.getElementById("del2").innerHTML = DATA.map(a => `<div class="kort"><h2><b>${a.nr}</b>${a.namn}</h2>` +
    a.mal.map((m, i) => { const k = id(a.nr, i); ordning[k] = blanda(m.alt.length);
      return `<div class="fraga" id="f-${k}"><div class="q">${m.q}<i>Mål: ${m.mal}</i></div>${m.bild ? `<div class="bild">${m.bild}</div>` : ""}

      <div class="fork">${m.fork}</div></div>`; }).join("") + `</div>`).join("");
  document.querySelectorAll("#del2 input").forEach(inp => inp.addEventListener("change", () => { svar[inp.name] = +inp.value; }));
}
function kommentar(s, r) {
  if (r && s === 2) return "Du kan det, och du visste det. Bra koll!";
  if (r) return "Rätt! Du kan mer än du trodde.";
  if (s === 2) return "Här trodde du att du kunde. Läs förklaringen och titta på lektionen igen.";
  if (s === 1) return "Du var lite osäker, och det här behöver du öva mer på.";
  return "Du kände rätt: det här behöver du öva mer på.";
}
const UTMANA = "../utmana-dig/kapitel-1.pdf";
const lnk = (u, t) => u ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : `<b>${t}</b>`;
function rek(a, ratt) {
  if (ratt === a.mal.length) return `<b>Tips:</b> Du klarade allt i ${a.nr}. Prova ${lnk(UTMANA, "Utmana dig")} för kapitel ${String(a.nr).split(".")[0]}.`;
  if (ratt === a.mal.length - 1) return `<b>Tips:</b> Läs förklaringen till frågan du missade och gör ${lnk(a.tb, "Tillbakablick " + a.nr)}.`;
  return `<b>Tips:</b> Titta på ${lnk(a.lek, "lektionen " + a.nr + " " + a.namn)} igen och träna med ${lnk(a.ts, "Trygg start " + a.nr)}.`;
}
function ratta() {
  const obes = DATA.flatMap(a => a.mal.map((m, i) => id(a.nr, i))).filter(k => !(k in svar));
  if (obes.length && !confirmFri(obes.length)) return;
  let rattTot = 0, stamde = 0, merAn = 0, trodde = 0;
  let html = "";
  DATA.forEach(a => {
    let ratt = 0, rader = "";
    a.mal.forEach((m, i) => {
      const k = id(a.nr, i), r = svar[k] === 0, s = skatt[k];
      if (r) { ratt++; rattTot++; }
      if ((r && s === 2) || (!r && s === 0)) stamde++;
      if (r && s < 2) merAn++;
      if (!r && s === 2) trodde++;
      rader += `<tr><td>${m.mal}</td><td><span class="etk e${s}">${SK[s]}</span></td><td>${r ? "✔ Rätt" : "✘ Fel"}</td><td>${kommentar(s, r)}</td></tr>`;
      const f = document.getElementById("f-" + k); f.classList.add("visa");
      f.querySelectorAll("label").forEach(l => { const j = +l.dataset.j; if (j === 0) l.classList.add("ratt"); else if (svar[k] === j) l.classList.add("fel"); });
      f.querySelectorAll("input").forEach(x => x.disabled = true);
    });
    html += `<div class="kort"><h2><b>${a.nr}</b>${a.namn} · ${ratt} av ${a.mal.length} rätt</h2>
      <table><tr><th>Mål</th><th>Din känsla</th><th>Svar</th><th>Kommentar</th></tr>${rader}</table><div class="rek">${rek(a, ratt)}</div></div>`;
  });
  document.getElementById("del3").innerHTML = `<div class="summa">
    <div><b>${rattTot} / ${tot}</b>rätt svar</div><div><b>${stamde}</b>gånger stämde din känsla</div>
    <div><b>${merAn}</b>gånger kunde du mer än du trodde</div><div><b>${trodde}</b>gånger trodde du att du kunde</div></div>
    <p class="info" style="margin-top:0">Rätt och fel syns också vid frågorna längre ned, med en förklaring.</p>` + html;
  visa(3);
}
function confirmFri(n) {
  const el = document.getElementById("kvarFr");
  if (el) { el.remove(); return true; }
  const p = document.createElement("p"); p.id = "kvarFr"; p.className = "info";
  p.textContent = `Du har ${n} fråga(or) kvar. Tryck på Rätta en gång till om du vill rätta ändå.`;
  document.getElementById("ratta").after(p); return false;
}
function visa(n) {
  ["s1", "s2", "s3"].forEach((s, i) => document.getElementById(s).classList.toggle("akt", i === n - 1));
  document.getElementById("del1").classList.toggle("dold", n !== 1);
  document.getElementById("till2").classList.toggle("dold", n !== 1);
  document.getElementById("kvar").classList.toggle("dold", n !== 1);
  document.getElementById("del2").classList.toggle("dold", n === 1);
  document.getElementById("ratta").classList.toggle("dold", n !== 2);
  document.getElementById("del3").classList.toggle("dold", n !== 3);
  document.getElementById("om").classList.toggle("dold", n !== 3);
  const fr = document.getElementById("kvarFr"); if (fr && n !== 2) fr.remove();
  if (n === 3) document.getElementById("del2").before(document.getElementById("del3"));
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.getElementById("till2").onclick = () => { del2(); visa(2); };
document.getElementById("ratta").onclick = ratta;
document.getElementById("om").onclick = () => { location.reload(); };
del1();
</script></body></html>
